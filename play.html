<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>去哪玩</title>
<link rel="stylesheet" href="css/liquid-tab.css">
<link rel="stylesheet" href="css/wheel.css">
<link rel="stylesheet" href="css/reset.css">
<style>
/* 雪花容器样式 */
#snow-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 100;
}

/* 雪花基础样式 */
.snowflake {
  position: absolute;
  top: -20px;
  color: #fff;
  opacity: 0.8;
  font-size: 1em;
  user-select: none;
  z-index: 100;
  text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
}

/* 雪花飘落动画 */
@keyframes fall {
  0% {
    transform: translateY(0) translateX(0) rotate(0deg);
    opacity: 0.8;
  }
  100% {
    transform: translateY(100vh) translateX(20px) rotate(360deg);
    opacity: 0.2;
  }
}
</style>
<style>
/* 粒子背景样式 */
#particle-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 50;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  opacity: 0;
}

/* 转盘悬浮效果 */
.wheelWrap:hover .wheel {
  transform: scale(1.02);
  box-shadow: 
    0 0 0 6px rgba(255, 255, 255, 0.9),
    0 0 0 8px rgba(255, 90, 90, 0.4),
    0 25px 50px rgba(0, 0, 0, 0.25);
  transition: all 0.3s ease;
}

/* 按钮脉冲效果 */
.btn.pulse::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
  transform: scale(0);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  to {
    transform: scale(2);
    opacity: 0;
  }
}

/* 选项卡切换动画 */
.liquidTab a {
  transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* 页面加载动画 */
.page {
  animation: fadeInUp 0.8s ease forwards;
  opacity: 0;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
<body>
<div class="page">
  <h2>去哪玩</h2>
  <div class="wheelWrap">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
    <button class="btn pulse" id="goBtn">GO</button>
  </div>
  <div class="bar">
    <input id="addInput" placeholder="新增地点" onkeypress="if(event.key==='Enter')addItem()">
    <button onclick="addItem()">
    <span>➕</span>
    添加
  </button>
</div>
</div>

<nav class="liquidTab">
  <a href="index.html">吃</a>
  <a href="play.html" class="active">玩</a>
  <a href="drink.html">喝</a>
</nav>

<script src="js/common.js"></script>
<script src="js/wheel.js"></script>
<script>
  const defaultArr = ['逛商场','爬山','看展','唱歌','海边散步','游乐园'];
  initPage(defaultArr,'play');
</script>
<!-- 自定义弹窗 -->
<div id="customAlert" class="custom-alert">
  <div class="custom-alert-content">
    <div class="alert-title">🎉 恭喜你抽中了</div>
    <div class="alert-result" id="alertResult"></div>
    <button class="alert-confirm" id="alertConfirm">确定</button>
  </div>
</div>
<!-- 粒子背景容器 -->
<div id="particle-container"></div>
<!-- 雪花容器 -->
<div id="snow-container"></div>

<script>
// 雪花效果脚本
document.addEventListener('DOMContentLoaded', function() {
  const snowContainer = document.getElementById('snow-container');
  const snowflakeCharacters = ['❄', '❅', '❆', '•'];
  
  function createSnowflake() {
    const snowflake = document.createElement('div');
    snowflake.classList.add('snowflake');
    
    // 随机选择雪花形状
    snowflake.textContent = snowflakeCharacters[Math.floor(Math.random() * snowflakeCharacters.length)];
    
    // 随机位置
    snowflake.style.left = Math.random() * 100 + 'vw';
    
    // 随机大小 (10px - 24px)
    const size = 10 + Math.random() * 14;
    snowflake.style.fontSize = size + 'px';
    
    // 随机透明度
    snowflake.style.opacity = 0.5 + Math.random() * 0.5;
    
    // 随机动画时长 (5-12秒) 和延迟
    const duration = 5 + Math.random() * 7;
    const delay = Math.random() * 5;
    
    snowflake.style.animation = `fall ${duration}s linear ${delay}s infinite`;
    
    // 随机左右飘动幅度
    const translateX = Math.random() * 40 - 20;
    snowflake.style.setProperty('--translate-x', `${translateX}px`);
    
    snowContainer.appendChild(snowflake);
    
    // 雪花落地后移除
    setTimeout(() => {
      if (snowflake.parentNode) {
        snowflake.parentNode.removeChild(snowflake);
      }
    }, (duration + delay) * 1000);
  }
  
  // 初始创建一批雪花
  for (let i = 0; i < 30; i++) {
    setTimeout(() => createSnowflake(), i * 300);
  }
  
  // 持续生成雪花（数量可控）
  setInterval(createSnowflake, 500);
});

// 粒子动画效果
document.addEventListener('DOMContentLoaded', function() {
  const particleContainer = document.getElementById('particle-container');
  const particleCount = 20; // 粒子数量
  
  // 创建粒子
  for (let i = 0; i < particleCount; i++) {
    createParticle();
  }
  
  function createParticle() {
    const particle = document.createElement('div');
    particle.classList.add('particle');
    
    // 随机大小 (2-6px)
    const size = 2 + Math.random() * 4;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    
    // 随机位置
    particle.style.left = `${Math.random() * 100}vw`;
    particle.style.top = `${Math.random() * 100}vh`;
    
    // 随机动画时长 (8-15秒)
    const duration = 8 + Math.random() * 7;
    
    // 动画：缓慢漂浮
    particle.animate([
      { transform: `translate(0, 0)`, opacity: 0.6 },
      { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)`, opacity: 0.2 },
      { transform: `translate(${Math.random() * 100 - 80}px, ${Math.random() * 100 - 80}px)`, opacity: 0 }
    ], {
      duration: duration * 1000,
      iterations: 1
    });
    
    particleContainer.appendChild(particle);
    
    // 动画结束后移除并创建新粒子
    setTimeout(() => {
      particle.remove();
      setTimeout(createParticle, Math.random() * 2000);
    }, duration * 1000);
  }
});
</script>
</body>
</html>
