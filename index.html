<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>今天吃什么</title>
<link rel="stylesheet" href="css/liquid-tab.css">
<link rel="stylesheet" href="css/wheel.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/all.css">
</head>
<body>
<div class="page">
  <h2>今天吃什么</h2>
  <div class="wheelWrap">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
    <button class="btn pulse" id="goBtn">GO</button>
  </div>
  <div class="bar">
    <input id="addInput" placeholder="新增食物" onkeypress="if(event.key==='Enter')addItem()">
    <button onclick="addItem()">
    <span>➕</span>
    添加
  </button>
</div>
</div>

<!-- 底部 iOS 玻璃导航 -->
<nav class="liquidTab">
  <div class="liquid-drop"></div>
  <a href="index.html" class="active">
    <img src="./images/吃.png" alt="">
  </a>
  <a href="play.html">
    <img src="./images/玩.png" alt="">
  </a>
  <a href="drink.html">
    <img src="./images/喝.png" alt="">
  </a>
  <!-- 水滴指示器将由JavaScript动态添加 -->
</nav>

<script src="js/common.js"></script>
<script src="js/wheel.js"></script>
<script src="js/snow.js"></script>
<script>
  /* 本页专属数据 */
  const defaultArr = ['猪脚饭','砂锅菜','粤式小炒','鲍汁捞饭','杀猪粉','牛腩粉','螺蛳粉','云吞面','正新香煲'];
  initPage(defaultArr,'food');
</script>
<!-- 自定义弹窗 -->
<div id="customAlert" class="custom-alert">
  <div class="custom-alert-content">
    <div class="alert-title">🎉 恭喜你抽中了</div>
    <div class="alert-result" id="alertResult"></div>
    <button class="alert-confirm" id="alertConfirm">确定</button>
  </div>
</div>
<!-- 粒子背景容器 -->
<div id="particle-container"></div>
<!-- 雪花容器 -->
<div id="snow-container"></div>
</body>
</html>
