<nav class="liquidTab">

  <a href="index.html">

  <a href="play.html">
    <img src="./images/玩.png" alt="">
  </a>
  <a href="drink.html" class="active">
    <img src="./images/喝.png" alt="">
  </a>
</nav>

<script src="js/common.js"></script>
<script src="js/wheel.js"></script>
<script src="js/"></script>

  initPage(defaultArr,'drink');
</script>
